<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zadanie 13 – Maszk</title>
  <script>
    function rozkladEgipski() {
      let m = parseInt(document.getElementById("m_kow").value);

      if (isNaN(m) || m <= 0) {
        document.getElementById("wynik").innerHTML = "Podaj liczbę m > 0!";
        return;
      }

      
      let cz1 = "1/" + (m + 1);
      let cz2 = "1/" + (m * (m + 1));

      document.getElementById("wynik").innerHTML =
        "1/" + m + " = " + cz1 + " + " + cz2;
    }
  </script>
</head>
<body>
  <h2 style="color:green;">Rozkład ułamka egipskiego – Zadanie 13 Maszk</h2>
  
  Podaj m: <input type="number" id="m_mas">
  <button onclick="rozkladEgipski()">Oblicz</button>
  
  <p id="wynik" style="color:green; font-size:30px;"></p>
  
</body>
</html>
