<!DOCTYPE html>   
<head>    
<title>Sprawdzenie danych Twoje nazwisko </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
do { 
var liczba1=prompt("wysokość=",""); 
var h_mas=parseFloat(liczba1); 
} 
while ( h_mas<=0); 
do { 
var liczba1=prompt("podstawę=",""); 
var a_mas=parseFloat(liczba1); 
while(!( a_mas>0)); 
} 
while(!( a_mas>0)); 
var Pole=a_mas*h_mas/2; 
document.write("Pole="+Pole.toFixed(2)+" cm^2"+"<br>"); 
</script> 
</div> 
</body> 
</html>
