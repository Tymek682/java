<html> 
     <head> 
           <script type="text/javascript"> 
                 var samochod = { 
   kolor: 'czerwone', 
   marka: 'mercedes', 
   typ: 'sportowe', 
   pokaz: function () 
     { 
        document.write(this.kolor + ' ' + this.marka + ' ' + this.typ) 
     } 
  } 
  samochod.pokaz(); 
            </script> 
     </head> 
<body> 
 <br> 
   Programowanie obiektowe. <br> 
     Obiekt  to  samochod<br> 
     Pola:<br> 
     kolor<br> 
     marka<br> 
     typ<br> 
     metoda :  pokaz<br> 
</body> 
</html>
