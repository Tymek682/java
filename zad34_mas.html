<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Prosty system logowania</title>
 
</head>
<body>

  <h2>Logowanie</h2>

  <form id="loginForm">
    <input type="email" id="email" placeholder="E-mail" >
    <input type="haslo" id="haslo" placeholder="Hasło" >
    <button type="submit">Zaloguj</button>
  </form>

  <div class="wyni" id="wyni"></div>

  <script>

    function User(email, haslo, avatarUrl) {
      this.email = email;
      this.haslo = haslo;
      this.avatarUrl = avatarUrl;
    }

 
    const userList = {
      users: [],

      addUser(user) {
        this.users.push(user);
      },

      login(email, haslo) {
        return this.users.some(u => u.email === email && u.haslo === haslo);
      }
    };

    userList.addUser(new User("grusza@gmail.com", "1111", "https://example.com/avdatar1.png"));
    userList.addUser(new User("jablko@gmai.com", "haslo", "https://example.com/avatar2.png"));

    
    const form = document.getElementById("loginForm");
    const wyni = document.getElementById("wyni");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const haslo = document.getElementById("haslo").value;

      const zalogowany = userList.login(email, haslo);

      if (zalogowany) {
        wyni.textContent = "Zalogowano pomyślnie!";
        wyni.style.color = "green";
      } else {
        wyni.textContent = "Nieprawidłowe dane logowania.";
        wyni.style.color = "red";
      }
    });
    function UserView(user) {
  this.user = user;

  // Tworzymy elementy
  const li = document.createElement("li");
  const img = document.createElement("img");
  const link = document.createElement("a");

  // Ustawiamy dane użytkownika
  img.src = user.avatarUrl;
  img.alt = "Avatar użytkownika";
  img.width = 50;
  img.height = 50;
  img.style.borderRadius = "50%";
  img.style.marginRight = "10px";
  img.style.verticalAlign = "middle";

  link.href = "mailto:" + user.email;
  link.textContent = user.email;
  link.style.textDecoration = "none";
  link.style.color = "#007bff";
  link.style.fontWeight = "bold";

  // Dodajemy elementy do <li>
  li.style.listStyle = "none";
  li.style.padding = "10px";
  li.style.border = "1px solid #ccc";
  li.style.margin = "5px";
  li.style.borderRadius = "10px";
  li.style.backgroundColor = "#f9f9f9";
  li.appendChild(img);
  li.appendChild(link);

  // Zapisz utworzony element DOM
  this.dom = li;
}

// Metoda refresh — odświeża dane w elemencie DOM
UserView.prototype.refresh = function() {
  const img = this.dom.querySelector("img");
  const link = this.dom.querySelector("a");

  img.src = this.user.avatarUrl;
  link.href = "mailto:" + this.user.email;
  link.textContent = this.user.email;
};
  </script>
</body>
</html>
