<!DOCTYPE html>   
<head>    
<title> proste obliczenia</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
var x1_mas=prompt("zmienna x1=",""); 
var x2_mas=prompt("zmienna x2=",""); 
//var suma; 
var a_mas=parseFloat(x1_mas); 
var b_mas=parseFloat(x2_mas); 
document.write("x1="+x1_mas +"&nbsp");
document.write("x2="+x2_mas +"&nbsp"+"<br>");

x1_mas_rad=(x1_mas*Math.PI)/180;
document.write("x1="+x1_mas+"&nbsp");
document.write("x1="+x1_mas_rad.toFixed(2)+"&nbsp"+"<br>");


y1_mas=3*Math.pow(x1_mas,9/11).toFixed(2);
document.write("Y1="+y1_mas+"<br>");


y2_mas=2*Math.cos(x1_mas)+3*Math.sin(x1_mas).toFixed(2);
document.write("Y2="+y2_mas.toFixed(2)+"<br>");

y3_p_mas=Math.pow(x1_mas,5)+Math.pow(x2_mas,4);
y3_mas=Math.pow(y3_p_mas+2,1/3)*Math.abs(x1_mas-x2_mas);
document.write("Y3="+y3_mas.toFixed(2));


//x1_mas_rad=(x1_mas&Math.PI)/180
//suma=a+b; 
//document.write("suma="+a+" + "+b+" = "+suma+"<br>"); 
</script> 
</div> 
</body> 
</html>
