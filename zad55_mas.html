<html lang="pl">
        </head>
    <meta charset="utf-8">
    <title></title>
    <script language="JavaScript">
        do {
            var l1_t_mas = prompt("Podaj pierwszą liczbę z przedziału <20,60>:");
            l1_t_mas = parseInt(l1_t_mas);
            if(l1_t_mas < 20 || l1_t_mas > 60) {
                alert("Liczba l1 nie należy do przedziału <20,60>");
            }
        } while(l1_t_mas < 20 || l1_t_mas > 60);
        do {
            var l2_t_mas = prompt("Podaj drugą liczbę z przedziału <20,60>");
            l2_t_mas = parseInt(l2_t_mas);
            if(l2_t_mas < 20 || l2_t_mas > 60) {
                alert("Liczba l2 nie należy do przedziału <20,60>");
            }
        } while(l2_t_mas < 20 || l2_t_mas > 60);
        
        var pocz_mas = prompt("Podaj początkową wielkość tekstu:");
        pocz_mas = parseInt(pocz_mas);
        
        var tekst_mas = prompt("Podaj dowolny tekst:");
        
        var i_mas = pocz_mas;
        if(l1_t_mas < l2_t_mas) {
            while(i_mas <= 100) {
                document.write("<p style=\"font-size:" + i_mas + "px; color: black;\">" + tekst_mas + "</p>");
                i_mas += 5;
            }
        } else if(l2_t_mas < l1_t_mas) {
            while(i_mas >= 0) {
                document.write("<p style=\"font-size:" + i_mas + "px; color: black;\">" + tekst_mas + "</p>");
                i_mas -= 5;
            }
        } else {
            document.write("<p style=\"font-size:" + i_mas + "px; color: black;\">" + tekst_mas + "</p>");
        
        }
    </script>
</head>

</body>
</html>
